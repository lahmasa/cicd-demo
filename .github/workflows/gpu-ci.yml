name: GPU CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu-cuda:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6

    - uses: eessi/github-action-eessi@v3
      with:
        eessi_stack_version: '2025.06'

    - name: Setup PantheonSim
      uses: pantheongpu/pantheonsim@main
      with:
        gpu: nvidia/h100
        count: 1
        cuda-toolkit: '13.0'
        library-path: true

    - name: Build and test our GPU package
      run: |
        module load CMake/4.0.3-GCCcore-14.3.0
        module load HDF5/1.14.6-gompi-2025b
        module load buildenv/default-foss-2025b

        # Check the environment
        module list
        gcc --version
        nvcc --version
        nvidia-smi -L

        # Configure
        mkdir build
        cd build

        cmake .. \
          -DENABLE_CUDA=ON \
          -DCMAKE_CUDA_ARCHITECTURES=90-virtual

        # Build
        make -j

        # Test
        ctest --output-on-failure --verbose

      shell: bash